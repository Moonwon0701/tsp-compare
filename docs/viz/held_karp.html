<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Held-Karp DP 탐색기</title>
<!--
  점 6개 예제로 Held-Karp DP 표가 부분집합 크기별로 채워지는 과정을 보여 준다.
  좌표는 make_instance("uniform", 6, 0)을 정수로 반올림한 값이다 (tsp/instances.py).
  외부 라이브러리 없이 브라우저에서 이 파일만 열면 동작한다.
-->
<style>
:root{
  --text-primary:#1f1e1d;--text-secondary:#5f5e5a;--text-muted:#888780;
  --bg-neutral:#f1efe8;--border:#d3d1c7;--border-strong:#b4b2a9;
  --bg-accent:#e6f1fb;--text-accent:#0c447c;--border-accent:#378add;--border-success:#1d9e75;
  --page:#ffffff;--radius:8px;
  --gray-fill:#f1efe8;--gray-stroke:#888780;--gray-text:#444441;
  --coral-fill:#faece7;--coral-stroke:#d85a30;--coral-text:#712b13;
  --purple-fill:#eeedfe;--purple-stroke:#7f77dd;--purple-text:#3c3489;
  --blue-fill:#e6f1fb;--blue-stroke:#378add;--blue-text:#0c447c;
}
@media (prefers-color-scheme: dark){
  :root{
    --text-primary:#f1efe8;--text-secondary:#b4b2a9;--text-muted:#888780;
    --bg-neutral:#2c2c2a;--border:#444441;--border-strong:#5f5e5a;
    --bg-accent:#0c447c;--text-accent:#e6f1fb;
    --page:#1f1e1d;
    --gray-fill:#444441;--gray-stroke:#b4b2a9;--gray-text:#f1efe8;
    --coral-fill:#712b13;--coral-stroke:#f0997b;--coral-text:#faece7;
    --purple-fill:#3c3489;--purple-stroke:#afa9ec;--purple-text:#eeedfe;
    --blue-fill:#0c447c;--blue-stroke:#85b7eb;--blue-text:#e6f1fb;
  }
}
body{margin:0;padding:2rem;background:var(--page);color:var(--text-primary);font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;line-height:1.6}
main{max-width:720px;margin:0 auto}
h1{font-size:20px;font-weight:500;margin:0 0 .25rem}
.lead{font-size:14px;color:var(--text-secondary);margin:0 0 1.5rem}
button{font:inherit;font-size:13px;padding:6px 12px;border-radius:var(--radius);border:0.5px solid var(--border-strong);background:transparent;color:var(--text-primary);cursor:pointer}
button:hover{background:var(--bg-neutral)}
input[type=range]{accent-color:var(--border-accent)}
.wrap{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:640px){.wrap{grid-template-columns:1fr}}
.metric{background:var(--bg-neutral);border-radius:var(--radius);padding:.6rem .8rem}
.metric .l{font-size:12px;color:var(--text-secondary)}
.metric .v{font-size:20px;font-weight:500}
.row{display:flex;justify-content:space-between;gap:8px;padding:5px 8px;border-radius:var(--radius);font-size:13px;cursor:pointer;border:0.5px solid transparent}
.row:hover{background:var(--bg-neutral)}
.row.on{border-color:var(--border-accent);background:var(--bg-accent);color:var(--text-accent)}
.row .c{font-family:ui-monospace,Consolas,monospace;color:var(--text-secondary)}
.row.on .c{color:var(--text-accent)}
.row.best{border-color:var(--border-success)}
.node circle{stroke-width:1}
.gray circle{fill:var(--gray-fill);stroke:var(--gray-stroke)} .gray text{fill:var(--gray-text)}
.coral circle{fill:var(--coral-fill);stroke:var(--coral-stroke)} .coral text{fill:var(--coral-text)}
.purple circle{fill:var(--purple-fill);stroke:var(--purple-stroke)} .purple text{fill:var(--purple-text)}
.blue circle{fill:var(--blue-fill);stroke:var(--blue-stroke)} .blue text{fill:var(--blue-text)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-secondary);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px;border:1px solid}
</style>
</head>
<body>
<main>
<h1>Held-Karp DP 탐색기</h1>
<p class="lead">상태 dp[S][j]는 점 0에서 출발해 집합 S의 점을 모두 거쳐 j에서 끝나는 가장 짧은 경로의 길이입니다. 슬라이더로 |S|를 키우며 표가 채워지는 순서를 보고, 상태를 눌러 그 상태가 기억하는 경로를 확인하세요.</p>

<div style="display:flex;align-items:center;gap:12px;margin:0 0 1rem">
  <label for="k" style="font-size:14px;color:var(--text-secondary)">부분집합 크기 |S|</label>
  <input type="range" id="k" min="1" max="5" step="1" value="1" style="flex:1">
  <span id="kout" style="font-size:14px;font-weight:500;min-width:16px">1</span>
</div>

<div class="wrap">
  <div>
    <svg id="svg" viewBox="0 0 300 300" width="300" height="300" role="img" aria-label="점 6개와 선택한 상태의 부분 경로"></svg>
    <div class="legend">
      <span><i style="background:var(--coral-fill);border-color:var(--coral-stroke)"></i>출발점 0</span>
      <span><i style="background:var(--purple-fill);border-color:var(--purple-stroke)"></i>거친 점</span>
      <span><i style="background:var(--blue-fill);border-color:var(--blue-stroke)"></i>끝점 j</span>
    </div>
    <p id="cap" style="font-size:13px;color:var(--text-secondary);margin:8px 0 0;line-height:1.5"></p>
  </div>
  <div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px">
      <div class="metric"><div class="l">이 크기의 상태 수</div><div class="v" id="ns">0</div></div>
      <div class="metric"><div class="l">지금까지 채운 상태</div><div class="v" id="tot">0</div></div>
    </div>
    <div style="font-size:12px;color:var(--text-muted);margin:0 0 6px">상태 dp[S][j] (S는 거친 점, j는 마지막 점) · 눌러서 경로 보기</div>
    <div id="list" style="display:flex;flex-direction:column;gap:2px"></div>
  </div>
</div>
</main>

<script>
const P = [[286, 339], [622, 386], [38, 780], [908, 434], [617, 982], [487, 90]];
const n = P.length, m = n - 1, FULL = (1 << m) - 1;
const D = (a, b) => Math.hypot(P[a][0] - P[b][0], P[a][1] - P[b][1]);

// Held-Karp: tsp/held_karp.py와 같은 방식 (비트마스크 오름차순으로 다음 점에 값을 밀어 넣음)
const dp = [], par = [];
for (let s = 0; s <= FULL; s++) { dp.push(Array(m).fill(Infinity)); par.push(Array(m).fill(-1)); }
for (let j = 0; j < m; j++) dp[1 << j][j] = D(0, j + 1);
for (let s = 1; s <= FULL; s++) for (let j = 0; j < m; j++) {
  const c = dp[s][j]; if (c === Infinity) continue;
  for (let k = 0; k < m; k++) {
    if (s & (1 << k)) continue;
    const ns = s | (1 << k), v = c + D(j + 1, k + 1);
    if (v < dp[ns][k]) { dp[ns][k] = v; par[ns][k] = j; }
  }
}
const popcount = s => { let c = 0; while (s) { c += s & 1; s >>= 1; } return c; };
const setStr = s => '{' + [...Array(m).keys()].filter(k => s & (1 << k)).map(k => k + 1).join(',') + '}';
function path(s, j) { const o = []; while (j !== -1) { o.push(j + 1); const p = par[s][j]; s ^= 1 << j; j = p; } return [0, ...o.reverse()]; }

let bestEnd = 0, bestLen = Infinity;
for (let j = 0; j < m; j++) { const t = dp[FULL][j] + D(j + 1, 0); if (t < bestLen) { bestLen = t; bestEnd = j; } }

const X = v => 20 + v * 0.26, Y = v => 280 - v * 0.26;
const svg = document.getElementById('svg');
let sel = null;

function draw() {
  let h = '';
  const pt = sel ? path(sel.s, sel.j) : [];
  if (sel) {
    const seq = sel.closed ? [...pt, 0] : pt;
    for (let i = 0; i + 1 < seq.length; i++) {
      const a = P[seq[i]], b = P[seq[i + 1]], ret = sel.closed && i === seq.length - 2;
      h += `<line x1="${X(a[0])}" y1="${Y(a[1])}" x2="${X(b[0])}" y2="${Y(b[1])}" stroke="${ret ? '#1D9E75' : '#378ADD'}" stroke-width="2.5" ${ret ? 'stroke-dasharray="5 4"' : ''}/>`;
    }
  }
  P.forEach((p, i) => {
    const end = sel && !sel.closed && i === sel.j + 1;
    const cls = i === 0 ? 'coral' : end ? 'blue' : pt.includes(i) ? 'purple' : 'gray';
    h += `<g class="node ${cls}"><circle cx="${X(p[0])}" cy="${Y(p[1])}" r="13"/><text x="${X(p[0])}" y="${Y(p[1])}" text-anchor="middle" dominant-baseline="central" style="font-size:12px;font-weight:500">${i}</text></g>`;
  });
  svg.innerHTML = h;
  const cap = document.getElementById('cap');
  if (!sel) cap.textContent = '점 0에서 출발합니다. 오른쪽 상태를 누르면 그 상태가 기억하는 최단 부분 경로가 나타납니다.';
  else if (sel.closed) cap.textContent = `최적 순회 ${pt.join('→')}→0, 길이 ${bestLen.toFixed(1)}. 초록 점선이 출발점으로 돌아오는 간선입니다.`;
  else cap.textContent = `dp[${setStr(sel.s)}][${sel.j + 1}] = ${dp[sel.s][sel.j].toFixed(1)}: 경로 ${pt.join('→')}. 같은 S, 같은 끝점으로 가는 다른 순서는 모두 버려졌습니다.`;
}

function render() {
  const k = +document.getElementById('k').value;
  document.getElementById('kout').textContent = k;
  const rows = [];
  for (let s = 1; s <= FULL; s++) if (popcount(s) === k) for (let j = 0; j < m; j++) if (s & (1 << j)) rows.push({ s, j });
  let tot = 0; for (let s = 1; s <= FULL; s++) if (popcount(s) <= k) tot += popcount(s);
  document.getElementById('ns').textContent = rows.length;
  document.getElementById('tot').textContent = tot;
  const list = document.getElementById('list'); list.innerHTML = '';
  const shown = rows.slice(0, 10);
  shown.forEach(r => {
    const d = document.createElement('div'); d.className = 'row';
    const isBest = k === m && r.j === bestEnd; if (isBest) d.classList.add('best');
    d.innerHTML = `<span>dp[${setStr(r.s)}][${r.j + 1}]${isBest ? ' · 최적 끝점' : ''}</span><span class="c">${dp[r.s][r.j].toFixed(1)}</span>`;
    d.onclick = () => { document.querySelectorAll('.row').forEach(e => e.classList.remove('on')); d.classList.add('on'); sel = { s: r.s, j: r.j, closed: false }; draw(); };
    list.appendChild(d);
  });
  if (rows.length > shown.length) {
    const more = document.createElement('div');
    more.style.cssText = 'font-size:12px;color:var(--text-muted);padding:4px 8px';
    more.textContent = `외 ${rows.length - shown.length}개`; list.appendChild(more);
  }
  if (k === m) {
    const b = document.createElement('button'); b.textContent = '최적 순회 닫기'; b.style.marginTop = '8px';
    b.onclick = () => { document.querySelectorAll('.row').forEach(e => e.classList.remove('on')); sel = { s: FULL, j: bestEnd, closed: true }; draw(); };
    list.appendChild(b);
  }
  sel = null; draw();
}
document.getElementById('k').addEventListener('input', render);
render();
</script>
</body>
</html>
